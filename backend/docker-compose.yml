services:
  postgres:
    image: postgres:16
    container_name: rail-ticket-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rail_ticket
    volumes:
      - rail_ticket_pgdata:/var/lib/postgresql/data

volumes:
  rail_ticket_pgdata:
