services:
  api:
    build: .
    container_name: rail-ticket-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.data?.db==='connected'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
