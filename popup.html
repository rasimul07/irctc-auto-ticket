<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRCTC Tatkal</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <h1>IRCTC Tatkal Bot</h1>
      <button type="button" id="toggleMinimizeBtn" class="icon-btn" title="Minimize" aria-label="Minimize popup">−</button>
    </div>
    <p id="statusBadge" class="badge">Idle</p>
  </header>

  <div id="popupBody" class="popup-body">
  <nav class="tabs">
    <button class="tab active" data-tab="access">Access</button>
    <button class="tab" data-tab="credentials">Login</button>
    <button class="tab" data-tab="journey">Journey</button>
    <button class="tab" data-tab="passengers">Passengers</button>
    <button class="tab" data-tab="schedule">Timer</button>
    <button class="tab" data-tab="payment">Payment</button>
  </nav>

  <main>
    <section id="access" class="panel active">
      <p id="accessStatusText" class="access-status">Checking access...</p>
      <dl class="access-details">
        <div class="access-detail-row">
          <dt>Subscription</dt>
          <dd id="accessTier">—</dd>
        </div>
        <div class="access-detail-row">
          <dt>Valid until</dt>
          <dd id="accessValidUntil">—</dd>
        </div>
        <div class="access-detail-row">
          <dt>Status</dt>
          <dd id="accessActive">—</dd>
        </div>
      </dl>
      <label>Buy Me a Coffee email
        <input type="email" id="accessEmail" placeholder="email used on Buy Me a Coffee" autocomplete="email">
      </label>
      <button type="button" id="linkAccessEmailBtn" class="btn-secondary">Link email &amp; refresh</button>
      <p class="access-note">
        Free trial is limited. After paying on
        <a id="bmcLink" href="https://buymeacoffee.com/mritools" target="_blank" rel="noopener noreferrer">Buy Me a Coffee</a>,
        link the same email here to unlock full access on extension and future Android app.
      </p>
    </section>

    <section id="credentials" class="panel">
      <label>Username <input type="text" id="username" autocomplete="username"></label>
      <label>Password <input type="password" id="password" autocomplete="current-password"></label>
    </section>

    <section id="journey" class="panel">
      <label>From station code or station name <input type="text" id="fromStation" placeholder="e.g. MLDT or MALDA TOWN"></label>
      <label>To station code or station name <input type="text" id="toStation" placeholder="e.g. SDAH or SEALDAH"></label>
      <label>Journey Date <input type="date" id="journeyDate"></label>
      <label>Train Number (preferred) <input type="text" id="trainNo" placeholder="e.g. 12345"></label>
      <label>Train Name (optional) <input type="text" id="trainName" placeholder="e.g. GOURDAMODAR EXP"></label>
      <label>Class
        <select id="travelClass">
          <option value="SL">SL - Sleeper</option>
          <option value="3A">3A - AC 3 Tier</option>
          <option value="2A">2A - AC 2 Tier</option>
          <option value="1A">1A - AC First</option>
          <option value="CC">CC - AC Chair</option>
          <option value="2S">2S - Second Sitting</option>
          <option value="3E">3E - AC 3 Economy</option>
          <option value="EC">EC - Exec. Chair Car</option>
          <option value="EV">EV - Vistadome AC</option>
        </select>
      </label>
      <label>Quota
        <select id="quota">
          <option value="TATKAL">TATKAL</option>
          <option value="GENERAL">GENERAL</option>
          <option value="LADIES">LADIES</option>
        </select>
      </label>
    </section>

    <section id="passengers" class="panel">
      <div id="passengerList"></div>
      <button type="button" id="addPassenger" class="btn-secondary">+ Add Passenger</button>
    </section>

    <section id="schedule" class="panel">
      <label class="checkbox-row">
        <input type="checkbox" id="scheduleEnabled"> Enable Tatkal scheduler
      </label>
      <label>Tatkal Window
        <select id="scheduleType">
          <option value="ac">AC Tatkal — 10:00 AM IST</option>
          <option value="non-ac">Non-AC Tatkal — 11:00 AM IST</option>
        </select>
      </label>
    </section>

    <section id="payment" class="panel">
      <label>Payment Method
        <select id="paymentMethod">
          <option value="cards">Cards / Net Banking / Wallets / EMI / UPI_CC / Others</option>
          <option value="upi">BHIM / UPI</option>
        </select>
      </label>

      <label class="checkbox-row">
        <input type="checkbox" id="autoPayEnabled"> Enable auto pay
      </label>

      <div id="cardsPaymentFields" class="payment-subpanel payment-subpanel--hidden">
        <label>Payment Provider
          <select id="cardsProvider">
            <option value="IRCTC iPay">IRCTC iPay</option>
            <option value="IRCTC E-Wallet">IRCTC E-Wallet</option>
            <option value="PhonePe" selected>PhonePe</option>
          </select>
        </label>

        <div id="autoPayOptions" class="payment-subpanel payment-subpanel--hidden">
          <fieldset class="payment-subsection">
            <h4>Auto pay type</h4>
            <label class="checkbox-row">
              <input type="radio" name="autoPayType" value="debit" checked> Debit card
            </label>
            <label class="checkbox-row">
              <input type="radio" name="autoPayType" value="credit"> Credit card
            </label>
            <label class="checkbox-row">
              <input type="radio" name="autoPayType" value="qr"> QR (UPI)
            </label>
          </fieldset>
        </div>

        <fieldset id="debitCardFields" class="payment-subsection">
          <h4>Debit Card</h4>
          <label>Card Name <input type="text" id="debitCardName" autocomplete="cc-name"></label>
          <label>Card Number <input type="text" id="debitCardNumber" inputmode="numeric" maxlength="19" autocomplete="cc-number"></label>
          <label>Expiry <input type="text" id="debitCardExpiry" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp"></label>
          <label>CVV <input type="password" id="debitCardCvv" maxlength="4" autocomplete="cc-csc"></label>
        </fieldset>

        <fieldset id="creditCardFields" class="payment-subsection">
          <h4>Credit Card</h4>
          <label>Card Name <input type="text" id="creditCardName" autocomplete="cc-name"></label>
          <label>Card Number <input type="text" id="creditCardNumber" inputmode="numeric" maxlength="19" autocomplete="cc-number"></label>
          <label>Expiry <input type="text" id="creditCardExpiry" placeholder="MM/YY" maxlength="5" autocomplete="cc-exp"></label>
          <label>CVV <input type="password" id="creditCardCvv" maxlength="4" autocomplete="cc-csc"></label>
        </fieldset>
      </div>

      <div id="upiPaymentFields" class="payment-subpanel payment-subpanel--hidden">
        <label>UPI Provider
          <select id="upiProvider">
            <option value="IRCTC iPay" selected>IRCTC iPay</option>
            <option value="PhonePe">PhonePe (recommended)</option>
            <option value="Razorpay">Razorpay</option>
            <option value="PayU">PayU</option>
            <option value="Amazon Pay">Amazon Pay</option>
          </select>
        </label>
      </div>
    </section>
  </main>

  <footer class="actions">
    <button type="button" id="saveBtn" class="btn-primary">Save Details</button>
    <button type="button" id="startBtn" class="btn-accent">Start Auto-Booking</button>
    <button type="button" id="clearBtn" class="btn-danger">Clear All Data</button>
    <p id="message" class="message"></p>
  </footer>
  </div>

  <script src="lib/storage.js"></script>
  <script src="lib/accessConfig.js"></script>
  <script src="lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
